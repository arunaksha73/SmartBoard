<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBoard</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #070a12;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    #loading { font-size: 1.1rem; opacity: 0.6; letter-spacing: 0.05em; }
  </style>
</head>
<body>
  <div id="loading">Loading SmartBoard…</div>
  <script>
    (function () {
      var ua       = navigator.userAgent || '';
      var platform = navigator.platform  || '';

      // ── PRIMARY SIGNAL: User-Agent regex ───────────────────────────────────
      // Real phones and mobile browsers all identify themselves here.
      // Windows / macOS / Linux desktops NEVER appear in this list — even when
      // the machine has a touchscreen, touchpad, or maxTouchPoints > 0.
      var MOBILE_UA_RE = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|SamsungBrowser|Mobile Safari|MIUI|HarmonyOS/i;

      // ── SPECIAL CASE: iPadOS 13+ ───────────────────────────────────────────
      // iPads on iOS 13+ request desktop UA ("Macintosh") by default.
      // A real Mac has maxTouchPoints = 0; an iPad reports 5.
      var isIpadOS = (
        platform === 'MacIntel' &&
        (navigator.maxTouchPoints || 0) > 1 &&
        !window.MSStream   // not IE
      );

      var isMobileOrTablet = MOBILE_UA_RE.test(ua) || isIpadOS;
      var target           = isMobileOrTablet ? '/remote.html' : '/board.html';

      // ── Debug: verify in DevTools console ─────────────────────────────────
      console.log('[SmartBoard] Device Detection');
      console.log('  userAgent        :', ua);
      console.log('  platform         :', platform);
      console.log('  maxTouchPoints   :', navigator.maxTouchPoints);
      console.log('  isMobileOrTablet :', isMobileOrTablet);
      console.log('  → Redirecting to :', target);

      window.location.replace(target);
    })();
  </script>
</body>
</html>
