<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1024"/>
      <stop offset="50%" stop-color="#070a16"/>
      <stop offset="100%" stop-color="#030409"/>
    </linearGradient>

    <!-- Glowing Screen Frame Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Stand Gradient -->
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Stylized S Gradient -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <!-- Play Button Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glow Filter for Ambient Lights -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
    </filter>

    <!-- Neon Glow Filter for Shapes -->
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="sDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#4f46e5" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2.5"/>

  <!-- Ambient Backdrop Glows -->
  <circle cx="130" cy="250" r="120" fill="#38bdf8" opacity="0.22" filter="url(#ambientGlow)"/>
  <circle cx="380" cy="240" r="130" fill="#a855f7" opacity="0.28" filter="url(#ambientGlow)"/>

  <!-- Smartboard Frame (Monitor Display) -->
  <!-- Glow Layer -->
  <rect x="92" y="152" width="328" height="216" rx="42" fill="none" stroke="url(#screenGrad)" stroke-width="24" opacity="0.8" filter="url(#neonGlow)"/>
  <!-- Sharp Core Screen Frame -->
  <rect x="92" y="152" width="328" height="216" rx="42" fill="rgba(10, 15, 30, 0.6)" stroke="url(#screenGrad)" stroke-width="18"/>

  <!-- Smartboard Monitor Stand Base -->
  <rect x="214" y="380" width="84" height="12" rx="6" fill="#4f46e5" opacity="0.75" filter="url(#neonGlow)"/>
  <rect x="180" y="390" width="152" height="16" rx="8" fill="url(#standGrad)" filter="url(#neonGlow)"/>

  <!-- Stylized Geometric "S" Symbol -->
  <g filter="url(#sDropShadow)">
    <path d="M 314 136 
             C 214 136 174 180 174 232 
             C 174 286 218 298 278 298 
             C 334 298 346 316 346 344 
             C 346 376 314 398 248 398 
             C 204 398 176 382 170 374"
          fill="none" 
          stroke="url(#sGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Glowing Play Button Triangle on Bottom-Right of Display -->
  <g filter="url(#neonGlow)" transform="translate(332, 298)">
    <path d="M 8 8 C 8 3.5 13 1 17 3.2 L 44 19.8 C 47.5 22 47.5 27 44 29.2 L 17 45.8 C 13 48 8 45.5 8 41 Z" 
          fill="url(#playGrad)"/>
  </g>
</svg>
