<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBoard Remote</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a12;
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.8), 0 0 1px 1px rgba(255, 255, 255, 0.15);
      --border: rgba(255, 255, 255, 0.12);
      --border-focus: #4f46e5;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --amber: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      width: 100%;
      max-width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      max-width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      color: var(--text);
    }

    /* ── Screen 1: Classroom PIN Pairing Overlay ── */
    .pin-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        radial-gradient(ellipse 900px 500px at 50% 0%, rgba(79, 70, 229, 0.28), transparent 70%),
        radial-gradient(circle 500px at 85% 85%, rgba(139, 92, 246, 0.12), transparent 60%),
        radial-gradient(circle 500px at 15% 80%, rgba(56, 189, 248, 0.10), transparent 60%),
        radial-gradient(1200px 800px at 50% 50%, #0d1527 0%, #070a12 100%);
      background-size: 36px 36px, 36px 36px, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
      z-index: 100;
      padding: 24px;
    }

    .pin-card {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 44px 36px 36px;
      text-align: center;
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.8), 0 0 35px rgba(79, 70, 229, 0.2);
    }

    .brand-tag {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #818cf8;
      margin-bottom: 20px;
    }

    .brand-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .brand-clock {
      font-family: 'Space Grotesk', monospace, sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 12px;
      font-variant-numeric: tabular-nums;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f8fafc;
      margin-bottom: 10px;
    }

    p.sub {
      color: #94a3b8;
      font-size: 14.5px;
      margin-bottom: 30px;
    }

    .pin-inputs {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .pin-input-box {
      width: 64px;
      height: 76px;
      font-family: 'Space Grotesk', monospace, sans-serif;
      font-size: 34px;
      font-weight: 700;
      text-align: center;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      outline: none;
      transition: all 0.2s ease;
    }

    .pin-input-box:focus {
      border-color: #818cf8;
      background: rgba(99, 102, 241, 0.12);
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
    }

    .btn-connect {
      width: 100%;
      height: 56px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 10px 28px -6px rgba(79, 70, 229, 0.5);
      transition: all 0.2s ease;
    }

    .btn-connect:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 32px -4px rgba(79, 70, 229, 0.6);
    }

    .error-msg {
      margin-top: 14px;
      font-size: 13px;
      color: #f87171;
      min-height: 18px;
    }

    /* ── Creator Credit Section ── */
    .pin-footer.creator-credit {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .creator-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .creator-label {
      font-size: 11.5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-dim);
      opacity: 0.85;
    }

    .creator-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .creator-social-links {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .creator-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-dim);
      text-decoration: none;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .creator-btn svg {
      transition: transform 0.25s ease;
      flex-shrink: 0;
    }

    .creator-btn:hover {
      transform: translateY(-2px);
      color: #ffffff;
      background: rgba(99, 102, 241, 0.14);
      border-color: rgba(99, 102, 241, 0.45);
      box-shadow: 0 4px 16px rgba(79, 70, 229, 0.28);
    }

    .creator-btn:hover svg {
      transform: scale(1.12);
    }

    .creator-btn:active {
      transform: translateY(0);
    }

    /* Top Bar Creator Badge (Active Presentation) */
    .top-bar-divider {
      width: 1px;
      height: 18px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 4px;
    }

    .top-bar-creator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .top-bar-creator strong {
      color: var(--text);
      font-weight: 600;
    }

    .top-bar-socials {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .top-bar-social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-dim);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .top-bar-social-btn:hover {
      color: #ffffff;
      background: rgba(99, 102, 241, 0.16);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateY(-1px);
    }

    @media (max-width: 768px) {
      .top-bar-creator, .top-bar-divider {
        display: none;
      }
    }

    /* ── Screen 2: Active Presentation Display ── */
    #presentationContainer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: #070a12;
      transition: background-color 0.3s ease;
    }

    .top-bar {
      height: 52px;
      padding: 0 24px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .top-bar-left, .top-bar-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
    }

    .top-bar-right button {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-dim);
      padding: 5px 12px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .canvas-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.2s ease, filter 0.3s ease;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }

    .brightness-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: black;
      opacity: 0;
      z-index: 50;
      transition: opacity 0.3s ease;
    }

    /* Floating Navigation Controls */
    .board-nav {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 30;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .board-nav.hidden-controls, .top-bar.hidden-controls {
      opacity: 0;
      pointer-events: none;
      transform: translateY(100px);
    }

    .board-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .board-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .slide-counter {
      font-family: 'Space Grotesk', monospace, sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-dim);
      padding: 0 8px;
    }

    .slide-counter strong {
      color: #818cf8;
    }

    .restore-controls-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 40;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .restore-controls-btn.hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- SCREEN 1: PIN PAIRING OVERLAY -->
  <div class="pin-overlay" id="pinOverlay">
    <div class="pin-card">
      <div class="brand-tag">
        <div class="brand-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span>Smartboard Display</span>
        </div>
        <span id="pinLiveClock" class="brand-clock">--:-- --</span>
      </div>

      <h1>Enter Presentation PIN</h1>
      <p class="sub">Enter the 4-digit PIN generated on your phone remote to load your presentation.</p>

      <div class="pin-inputs" id="pinInputs">
        <input type="text" maxlength="1" class="pin-input-box" autofocus aria-label="PIN Digit 1" />
        <input type="text" maxlength="1" class="pin-input-box" aria-label="PIN Digit 2" />
        <input type="text" maxlength="1" class="pin-input-box" aria-label="PIN Digit 3" />
        <input type="text" maxlength="1" class="pin-input-box" aria-label="PIN Digit 4" />
      </div>

      <button class="btn-connect" id="btnConnect">CONNECT TO DISPLAY</button>
      <div class="error-msg" id="errorMsg"></div>

      <footer class="pin-footer creator-credit">
        <div class="creator-header">
          <span class="creator-label">Created by</span>
          <span class="creator-name">Arunaksha Das</span>
        </div>
        <div class="creator-social-links">
          <a href="https://github.com/arunaksha73" target="_blank" rel="noopener noreferrer" class="creator-btn" aria-label="GitHub profile of Arunaksha Das" title="GitHub">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
            </svg>
            <span>GitHub</span>
          </a>
          <a href="https://www.instagram.com/mr.ad_8974/" target="_blank" rel="noopener noreferrer" class="creator-btn" aria-label="Instagram profile of Arunaksha Das" title="Instagram">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            <span>Instagram</span>
          </a>
          <a href="https://linkedin.com/in/arunaksha-das" target="_blank" rel="noopener noreferrer" class="creator-btn" aria-label="LinkedIn profile of Arunaksha Das" title="LinkedIn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
              <rect x="2" y="9" width="4" height="12"></rect>
              <circle cx="4" cy="4" r="2"></circle>
            </svg>
            <span>LinkedIn</span>
          </a>
        </div>
      </footer>
    </div>
  </div>

  <!-- SCREEN 2: ACTIVE PRESENTATION DISPLAY -->
  <div id="presentationContainer">
    <!-- Top Status Bar -->
    <div class="top-bar" id="topBar">
      <div class="top-bar-left">
        <span>PIN: <strong id="displayPin" style="color: var(--amber);">----</strong></span>
        <span class="top-bar-divider"></span>
        <div class="top-bar-creator">
          <span>Created by <strong>Arunaksha Das</strong></span>
          <div class="top-bar-socials">
            <a href="https://github.com/arunaksha73" target="_blank" rel="noopener noreferrer" class="top-bar-social-btn" aria-label="GitHub profile of Arunaksha Das" title="GitHub">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
              </svg>
            </a>
            <a href="https://www.instagram.com/mr.ad_8974/" target="_blank" rel="noopener noreferrer" class="top-bar-social-btn" aria-label="Instagram profile of Arunaksha Das" title="Instagram">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
              </svg>
            </a>
            <a href="https://linkedin.com/in/arunaksha-das" target="_blank" rel="noopener noreferrer" class="top-bar-social-btn" aria-label="LinkedIn profile of Arunaksha Das" title="LinkedIn">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                <rect x="2" y="9" width="4" height="12"></rect>
                <circle cx="4" cy="4" r="2"></circle>
              </svg>
            </a>
          </div>
        </div>
      </div>
      <div class="top-bar-right">
        <span>Slide <strong id="slideNum" style="color: #818cf8;">1</strong> of <span id="pageCount">1</span></span>
        <button id="boardBtnFullscreen">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          Fullscreen
        </button>
      </div>
    </div>

    <!-- Presentation Canvas Workspace -->
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="pdfCanvas"></canvas>
    </div>

    <!-- Floating Navigation Bar -->
    <div class="board-nav" id="boardNav">
      <button class="board-btn" id="boardBtnPrev" title="Previous Slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <div class="slide-counter" id="boardSlideCounter">
        <span id="navCurrentSlide">1</span> / <span id="navTotalSlides">1</span>
      </div>

      <button class="board-btn" id="boardBtnNext" title="Next Slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>

      <button class="board-btn" id="hideControlsBtn" title="Hide Toolbar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>

    <!-- Restore Controls Floating Button -->
    <button class="restore-controls-btn hidden" id="restoreControlsBtn" title="Show Presentation Controls">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <div class="brightness-overlay" id="brightnessOverlay"></div>

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    var SERVER_URL = (
      (typeof window.SMARTBOARD_BACKEND_URL === 'string' && window.SMARTBOARD_BACKEND_URL.trim()) ||
      window.location.origin
    ).replace(/\/$/, '');

    // DOM references
    const pinOverlay          = document.getElementById('pinOverlay');
    const pinInputs           = Array.from(document.querySelectorAll('.pin-input-box'));
    const btnConnect          = document.getElementById('btnConnect');
    const errorMsg            = document.getElementById('errorMsg');
    const topBar              = document.getElementById('topBar');
    const displayPin          = document.getElementById('displayPin');
    const slideNum            = document.getElementById('slideNum');
    const pageCount           = document.getElementById('pageCount');
    const canvas              = document.getElementById('pdfCanvas');
    const ctx                 = canvas.getContext('2d');
    const canvasWrapper       = document.getElementById('canvasWrapper');
    const brightnessOverlay   = document.getElementById('brightnessOverlay');
    const boardNav            = document.getElementById('boardNav');
    const boardSlideCounter   = document.getElementById('boardSlideCounter');
    const boardBtnPrev        = document.getElementById('boardBtnPrev');
    const boardBtnNext        = document.getElementById('boardBtnNext');
    const hideControlsBtn     = document.getElementById('hideControlsBtn');
    const restoreControlsBtn  = document.getElementById('restoreControlsBtn');

    const navCurrentSlide     = document.getElementById('navCurrentSlide');
    const navTotalSlides      = document.getElementById('navTotalSlides');
    const boardBtnFullscreen  = document.getElementById('boardBtnFullscreen');
    const pinLiveClock        = document.getElementById('pinLiveClock');

    // Presentation & Socket State
    let pdfDoc           = null;
    let currentPageNum   = 1;
    let totalPagesCount  = 1;
    let isRendering      = false;
    let pageNumPending   = null;
    let currentScale     = 1.0;
    let userZoomFactor   = 1.0;
    let activePin        = null;
    let socket           = null;
    let controlsVisible  = true;

    // PIN Auto-Tab Input Logic
    pinInputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value;
        if (val && index < pinInputs.length - 1) {
          pinInputs[index + 1].focus();
        }
        if (getEnteredPin().length === 4) {
          connectWithPin(getEnteredPin());
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && index > 0) {
          pinInputs[index - 1].focus();
        }
      });
    });

    function getEnteredPin() {
      return pinInputs.map(i => i.value.trim()).join('');
    }

    btnConnect.addEventListener('click', () => {
      const pin = getEnteredPin();
      if (pin.length !== 4) {
        showError('Please enter a complete 4-digit PIN.');
        return;
      }
      connectWithPin(pin);
    });

    function showError(msg) {
      errorMsg.textContent = msg;
    }

    async function connectWithPin(pin) {
      showError('Connecting to session...');
      try {
        const response = await fetch(`${SERVER_URL}/api/presentation/${pin}`);
        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.error || 'PIN not found or presentation expired.');
        }

        const data = await response.json();
        if (data.ok && data.pdfUrl) {
          activePin = pin;
          displayPin.textContent = pin;
          pinOverlay.style.display = 'none';
          initBoardSocket(pin);
          loadPdf(`${SERVER_URL}${data.pdfUrl}`);
        } else {
          throw new Error(data.error || 'Invalid session response.');
        }
      } catch (err) {
        showError(err.message);
      }
    }

    function initBoardSocket(pin) {
      if (socket) return;
      socket = io(SERVER_URL, {
        transports: ['polling', 'websocket'],
        reconnection: true
      });

      socket.on('connect', () => {
        socket.emit('join-room', { pin, role: 'board' });
      });

      socket.on('slide-command', (data) => {
        if (data && data.page !== undefined) {
          queueRenderPage(data.page);
        }
      });

      socket.on('brightness-command', (data) => {
        if (data && data.brightness !== undefined) {
          const val = Math.max(0, Math.min(100, data.brightness));
          brightnessOverlay.style.opacity = (100 - val) / 100;
        }
      });

      socket.on('theme-command', (data) => {
        if (data && data.theme) {
          const container = document.getElementById('presentationContainer');
          if (data.theme === 'night') {
            container.style.backgroundColor = '#000000';
            canvas.style.filter = 'invert(0.9) hue-rotate(180deg)';
          } else {
            container.style.backgroundColor = '#070a12';
            canvas.style.filter = 'none';
          }
        }
      });

      socket.on('zoom-command', (data) => {
        if (data && data.action) {
          if (data.action === 'in') userZoomFactor = Math.min(2.5, userZoomFactor + 0.2);
          else if (data.action === 'out') userZoomFactor = Math.max(0.6, userZoomFactor - 0.2);
          else if (data.action === 'reset') userZoomFactor = 1.0;
          renderPage(currentPageNum);
        }
      });

      socket.on('presentation-controls', (data) => {
        if (data && typeof data.visible === 'boolean') {
          setControlsVisible(data.visible);
        }
      });

      socket.on('exit-presentation', () => {
        window.location.reload();
      });
    }

    async function loadPdf(url) {
      try {
        console.log(`[PDF] Loading PDF from: ${url}`);
        const loadingTask = pdfjsLib.getDocument(url);
        pdfDoc = await loadingTask.promise;
        totalPagesCount = pdfDoc.numPages;
        console.log(`[PDF] PDF loaded successfully`);
        console.log(`[PDF] Actual PDF page count (pdf.numPages): ${totalPagesCount}`);
        console.log(`[PDF] Board page count: ${totalPagesCount}`);
        pageCount.textContent = totalPagesCount;
        if (navTotalSlides) navTotalSlides.textContent = totalPagesCount;

        if (socket && activePin) {
          console.log(`[PDF] Emitting pdf-loaded: pin=${activePin}, totalPages=${totalPagesCount}`);
          socket.emit('pdf-loaded', { pin: activePin, totalPages: totalPagesCount });
        }

        renderPage(1);
      } catch (err) {
        console.error('PDF Loading Error:', err);
        showError('Could not render presentation PDF.');
      }
    }

    async function renderPage(num) {
      if (!pdfDoc) return;
      isRendering = true;
      currentPageNum = num;
      slideNum.textContent = num;
      if (navCurrentSlide) navCurrentSlide.textContent = num;

      try {
        const page = await pdfDoc.getPage(num);
        const viewportUnscaled = page.getViewport({ scale: 1.0 });

        const containerWidth = canvasWrapper.clientWidth || window.innerWidth;
        const containerHeight = canvasWrapper.clientHeight || window.innerHeight;

        const scaleX = containerWidth / viewportUnscaled.width;
        const scaleY = containerHeight / viewportUnscaled.height;
        const baseScale = Math.min(scaleX, scaleY) * 0.96;

        currentScale = baseScale * userZoomFactor;
        const viewport = page.getViewport({ scale: currentScale });

        const outputScale = window.devicePixelRatio || 1;
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = Math.floor(viewport.width) + "px";
        canvas.style.height = Math.floor(viewport.height) + "px";

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

        const renderContext = {
          canvasContext: ctx,
          transform: transform,
          viewport: viewport
        };

        await page.render(renderContext).promise;
        isRendering = false;

        if (pageNumPending !== null) {
          renderPage(pageNumPending);
          pageNumPending = null;
        }
      } catch (err) {
        console.error('Render error:', err);
        isRendering = false;
      }
    }

    function queueRenderPage(num) {
      if (isRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    boardBtnNext.addEventListener('click', () => {
      if (currentPageNum < totalPagesCount) {
        queueRenderPage(currentPageNum + 1);
        if (socket && activePin) socket.emit('slide-command', { pin: activePin, action: 'NEXT' });
      }
    });

    boardBtnPrev.addEventListener('click', () => {
      if (currentPageNum > 1) {
        queueRenderPage(currentPageNum - 1);
        if (socket && activePin) socket.emit('slide-command', { pin: activePin, action: 'PREV' });
      }
    });

    function setControlsVisible(visible) {
      controlsVisible = visible;
      if (visible) {
        boardNav.classList.remove('hidden-controls');
        topBar.classList.remove('hidden-controls');
        restoreControlsBtn.classList.add('hidden');
      } else {
        boardNav.classList.add('hidden-controls');
        topBar.classList.add('hidden-controls');
        restoreControlsBtn.classList.remove('hidden');
      }
    }

    hideControlsBtn.addEventListener('click', () => setControlsVisible(false));
    restoreControlsBtn.addEventListener('click', () => setControlsVisible(true));

    boardBtnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    window.addEventListener('resize', () => {
      if (pdfDoc) renderPage(currentPageNum);
    });

    function updateLiveClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: true });
      if (pinLiveClock) pinLiveClock.textContent = timeStr;
    }
    updateLiveClock();
    setInterval(updateLiveClock, 1000);
  </script>
</body>
</html>
